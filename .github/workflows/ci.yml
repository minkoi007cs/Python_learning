name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Verify Process & Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify process.md update
        run: node scripts/verify-process-update.mjs --ci

      - name: Architecture synchronization check
        if: github.event_name == 'pull_request'
        run: |
          # Warn if architecture-sensitive files changed but tech.md was not updated
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          ARCH_SENSITIVE=$(echo "$CHANGED_FILES" | grep -E '^(apps/api/app/core/|apps/web/lib/pyodide/|alembic/|docker-compose)' || true)
          TECH_UPDATED=$(echo "$CHANGED_FILES" | grep '^tech.md$' || true)
          if [ -n "$ARCH_SENSITIVE" ] && [ -z "$TECH_UPDATED" ]; then
            echo "::warning title=tech.md Not Updated::Architectural/core files were modified without updating tech.md. Please ensure tech.md reflects architectural changes."
          fi

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Frontend (if initialized)
        run: |
          if [ -f "apps/web/package.json" ]; then
            echo "Running frontend lint and typecheck..."
            # npm run lint / npm run typecheck when web app is installed
          else
            echo "Frontend not yet initialized. Skipping."
          fi

      - name: Check Backend (if initialized)
        run: |
          if [ -f "apps/api/pyproject.toml" ] || [ -f "apps/api/requirements.txt" ]; then
            echo "Running backend lint and typecheck..."
            # ruff check / mypy when api is installed
          else
            echo "Backend not yet initialized. Skipping."
          fi

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pytest (if initialized)
        run: |
          if [ -d "apps/api/tests" ]; then
            echo "Running pytest..."
            # pytest apps/api/tests
          else
            echo "Backend tests not yet initialized. Skipping."
          fi

  frontend-tests:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run vitest (if initialized)
        run: |
          if [ -f "apps/web/package.json" ]; then
            echo "Running frontend vitest..."
            # npm test when web app is installed
          else
            echo "Frontend tests not yet initialized. Skipping."
          fi

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [governance]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web (if initialized)
        run: |
          if [ -f "apps/web/package.json" ]; then
            echo "Building web..."
          else
            echo "Apps not yet created. Governance build check passed."
          fi
