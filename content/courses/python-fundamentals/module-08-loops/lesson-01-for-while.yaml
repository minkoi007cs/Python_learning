id: lesson-loops-01
slug: for-and-while-loops
title: Iterating with for & while
estimated_minutes: 12
concept_ids:
  - loops.for
  - loops.while
  - loops.range

sections:
  - type: markdown
    content: |
      ### The `for` Loop with `range()`
      When you know how many times you want to repeat an action, use a `for` loop:
      ```python
      for i in range(5):  # 0, 1, 2, 3, 4
          print(i)
      ```
      `range(start, stop, step)` generates a sequence of numbers from `start` up to (not including) `stop`.

      ### The `while` Loop
      A `while` loop repeats as long as a condition remains `True`:
      ```python
      count = 3
      while count > 0:
          print(count)
          count -= 1
      ```

  - type: code_example
    language: python
    code: |
      total = 0
      for num in [10, 20, 30]:
          total += num
      print(f"Total: {total}")
    explanation: |
      The accumulator `total` adds each number from the list.

  - type: exercise
    exercise:
      id: ex-loops-01
      title: Sum of Numbers with a Loop
      instructions: |
        Compute the sum of all integers from 1 up to 10 (inclusive) using a loop:
        1. Initialize `total_sum = 0`.
        2. Use a `for` loop with `range(1, 11)` to iterate over numbers from 1 to 10.
        3. In each iteration, add the number to `total_sum`.
        4. Print `total_sum`.
      starter_code: |
        total_sum = 0

        # Write your loop below:

      solution_code: |
        total_sum = 0
        for i in range(1, 11):
            total_sum += i
        print(total_sum)
      hints:
        - "Remember range(1, 11) stops before 11, so it includes 1 through 10."
        - "Use total_sum += i or total_sum = total_sum + i inside the indented block."
      difficulty: EASY
      xp_reward: 10
      visible_tests:
        - name: "total_sum equals 55"
          assertion: "namespace.get('total_sum') == 55"
      hidden_tests:
        - name: "Outputs 55"
          assertion: "'55' in stdout"
